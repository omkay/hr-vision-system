<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Zone Drawer — __VNAME__</title>
<style>
body{margin:0;padding:14px;font-family:sans-serif;background:#1a1a2e;color:#eee}
h2{margin:0 0 10px;color:#e2e8f0}
#bar{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
button{padding:8px 16px;border:none;border-radius:6px;cursor:pointer;font-size:13px;font-weight:700}
#bc{background:#e74c3c;color:#fff} #bu{background:#f39c12;color:#fff}
#bcp{background:#27ae60;color:#fff;font-size:14px;padding:10px 22px}
#st{font-weight:bold;font-size:14px;padding:5px 12px;background:#16213e;border-radius:4px}
canvas{cursor:crosshair;display:block;border:3px solid #4a5568;border-radius:6px}
#lst{margin-top:8px;padding:8px 12px;background:#16213e;border-radius:6px;font-size:13px;min-height:28px}
#jout{width:100%;height:90px;margin-top:8px;font-family:monospace;font-size:12px;
      background:#0d1117;color:#39d353;border:1px solid #30363d;border-radius:6px;padding:8px;resize:vertical}
#cmsg{color:#39d353;font-weight:bold;margin-left:12px;display:none}
</style></head><body>
<h2>Zone Drawer — __VNAME__</h2>
<div id="bar">
  <button id="bc">&#x1f5d1; Clear all</button>
  <button id="bu">&#x21a9; Undo</button>
  <span id="st"></span>
</div>
<canvas id="cv" width="__DW__" height="__DH__"></canvas>
<div id="lst"></div>
<div style="margin-top:14px">
  <button id="bcp">&#x1f4cb; Copy Zones JSON</button>
  <span id="cmsg">&#x2713; Copied! Paste into the notebook textarea.</span>
  <textarea id="jout" readonly></textarea>
</div>
<script>
const FW=__FW__,FH=__FH__,DW=__DW__,DH=__DH__,SC=DW/FW;
const CLR=['#e74c3c','#2ecc71','#3498db','#f39c12','#9b59b6','#1abc9c','#e67e22','#c0392b'];
const NAMES=['desk_a','desk_b','desk_c','common_area'];
let zones=__SEED__,pts=[],hover=null;
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const st=document.getElementById('st'),lst=document.getElementById('lst');
const jout=document.getElementById('jout');
const img=new Image();
img.onload=()=>draw();
img.onerror=()=>{st.textContent='Image failed to load';st.style.color='#e74c3c';};
img.src='data:image/jpeg;base64,__B64__';
function draw(){
  ctx.drawImage(img,0,0,DW,DH);
  zones.forEach((z,i)=>{
    const[,x1,y1,x2,y2]=z,c=CLR[i%CLR.length];
    ctx.strokeStyle=c;ctx.lineWidth=3;
    ctx.strokeRect(x1*SC,y1*SC,(x2-x1)*SC,(y2-y1)*SC);
    ctx.fillStyle=c;ctx.globalAlpha=0.2;
    ctx.fillRect(x1*SC,y1*SC,(x2-x1)*SC,(y2-y1)*SC);
    ctx.globalAlpha=1;
    const tw=ctx.measureText(z[0]).width;
    ctx.fillStyle=c;ctx.fillRect(x1*SC,y1*SC-24,tw+16,24);
    ctx.fillStyle='#fff';ctx.font='bold 14px Arial';
    ctx.fillText(z[0],x1*SC+8,y1*SC-7);
  });
  if(pts.length===1&&hover){
    const x1=Math.min(pts[0].x,hover.x),y1=Math.min(pts[0].y,hover.y);
    const x2=Math.max(pts[0].x,hover.x),y2=Math.max(pts[0].y,hover.y);
    ctx.strokeStyle='#00ff41';ctx.lineWidth=2;ctx.setLineDash([7,4]);
    ctx.strokeRect(x1*SC,y1*SC,(x2-x1)*SC,(y2-y1)*SC);ctx.setLineDash([]);
  }
  refresh();
}
function px(e){const r=cv.getBoundingClientRect();return{x:Math.round((e.clientX-r.left)/SC),y:Math.round((e.clientY-r.top)/SC)};}
cv.addEventListener('mousemove',e=>{hover=px(e);if(pts.length===1)draw();});
cv.addEventListener('click',e=>{
  const p=px(e);
  if(!pts.length){pts.push(p);st.textContent='Now click the opposite corner';st.style.color='#f39c12';}
  else{
    const x1=Math.min(pts[0].x,p.x),y1=Math.min(pts[0].y,p.y);
    const x2=Math.max(pts[0].x,p.x),y2=Math.max(pts[0].y,p.y);
    if(x2-x1<5||y2-y1<5){pts=[];idle();return;}
    const def=NAMES[zones.length]??('zone_'+(zones.length+1));
    const name=prompt('Zone name:',def);
    if(name&&name.trim())zones.push([name.trim(),x1,y1,x2,y2]);
    pts=[];hover=null;idle();draw();sync();
  }
});
document.getElementById('bc').onclick=()=>{if(!confirm('Clear all zones?'))return;zones=[];pts=[];sync();idle();draw();};
document.getElementById('bu').onclick=()=>{if(zones.length){zones.pop();sync();draw();}};
document.getElementById('bcp').onclick=()=>{
  navigator.clipboard.writeText(jout.value).then(()=>{
    const m=document.getElementById('cmsg');m.style.display='inline';
    setTimeout(()=>m.style.display='none',3000);
  }).catch(()=>{jout.select();document.execCommand('copy');});
};
function idle(){st.textContent='Click a corner to start a zone';st.style.color='#2ecc71';}
function sync(){jout.value=JSON.stringify(zones,null,2);}
function refresh(){
  if(!zones.length){lst.innerHTML='<i style="color:#718096">No zones yet</i>';return;}
  lst.innerHTML='<b>Zones:</b> '+zones.map((z,i)=>
    `<span style="margin-right:14px;white-space:nowrap">
      <span style="display:inline-block;width:11px;height:11px;background:${CLR[i%CLR.length]};border-radius:2px;vertical-align:middle"></span>
      <b>${z[0]}</b> <span style="color:#a0aec0">(${z[1]},${z[2]})&rarr;(${z[3]},${z[4]})</span>
    </span>`).join('');
  sync();
}
idle();sync();refresh();
</script></body></html>
